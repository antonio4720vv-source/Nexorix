spring.application.name=Nexorix

# ============================================================
# SESION Y SERVIDOR
# ============================================================

# Cierra la sesion tras 15 minutos sin actividad (app financiera).
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En produccion con HTTPS: NEXORIX_COOKIE_SECURE=true (la cookie solo viaja cifrada).
server.servlet.session.cookie.secure=${NEXORIX_COOKIE_SECURE:false}

# Nunca mostrar errores internos (trazas, mensajes) a quien visita.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
# La sesion solo viaja en cookie (nunca en la URL).
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=NXSESSION
# No revelar tecnologia en las cabeceras.
server.server-header=

# Cifrado de datos sensibles en la base de datos (cedula, correo, celular) con AES-256-GCM.
# Genera la clave UNA vez con:  openssl rand -base64 32   y guardala aparte de la base de datos.
# Obligatoria cuando NEXORIX_COOKIE_SECURE=true (produccion). Si la pierdes, esos datos no se recuperan.
nexorix.security.data-key=${NEXORIX_DATA_KEY:}

# Limites por IP en inicio de sesion, registro y recuperacion.
# Solo para pruebas de carga desde un mismo computador: NEXORIX_IP_LIMITS=false
nexorix.security.ip-limits=${NEXORIX_IP_LIMITS:true}

# Detras de ngrok (o de un proxy), entender que la conexion es HTTPS.
server.forward-headers-strategy=native

# Archivos de extractos: maximo 5 MB cada uno y hasta 10 por envio.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB

# Capacidad para muchas personas a la vez.
server.tomcat.threads.max=200
server.tomcat.accept-count=200
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000

# Respuestas comprimidas: la app carga mas rapido en el celular.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

# ============================================================
# POSTGRESQL
# ============================================================

spring.datasource.url=${NEXORIX_DB_URL:jdbc:postgresql://localhost:5432/nexorix}
spring.datasource.username=${NEXORIX_DB_USER:postgres}
spring.datasource.password=${NEXORIX_DB_PASSWORD}

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
# En false para no llenar la consola con miles de consultas cuando hay muchas personas.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# DIDIT
# ============================================================

didit.api.base-url=https://verification.didit.me
didit.api.key=${DIDIT_API_KEY}
didit.workflow-id=${DIDIT_WORKFLOW_ID}

# Secreto de firma de los webhooks (Didit > Webhooks > Secreto de firma).
# Si falta, Nexorix rechaza TODOS los webhooks (falla cerrado).
didit.webhook.secret=${DIDIT_WEBHOOK_SECRET:}

# ============================================================
# NEXORIX
# ============================================================

# Direccion publica de Nexorix. Didit devuelve al usuario a
# {public-url}/kyc-resultado.html cuando termina la verificacion.
nexorix.public-url=${NEXORIX_PUBLIC_URL:http://localhost:8080}

# ============================================================
# CORREO (codigo para recuperar contrasena o PIN)
# ============================================================
# Si NEXORIX_MAIL_HOST esta vacio, el codigo se muestra en la consola
# (solo para desarrollo). Ejemplo con Gmail:
#   NEXORIX_MAIL_HOST=smtp.gmail.com
#   NEXORIX_MAIL_USERNAME=tucorreo@gmail.com
#   NEXORIX_MAIL_PASSWORD=contrasena de aplicacion de Google (16 letras)

nexorix.mail.host=${NEXORIX_MAIL_HOST:}
nexorix.mail.port=${NEXORIX_MAIL_PORT:587}
nexorix.mail.username=${NEXORIX_MAIL_USERNAME:}
nexorix.mail.password=${NEXORIX_MAIL_PASSWORD:}
nexorix.mail.from=${NEXORIX_MAIL_FROM:}

# ============================================================
# RECUPERACION DE CUENTA
# ============================================================
# Revisa que el documento verificado en Didit sea el de la cuenta.
# En Sandbox los documentos son simulados y no coinciden: para probar
# ahi se puede poner NEXORIX_RECOVERY_DOCUMENT_CHECK=false.
# En produccion SIEMPRE debe ser true.
nexorix.recovery.document-check=${NEXORIX_RECOVERY_DOCUMENT_CHECK:true}

# ============================================================
# IMPORTACION DE EXTRACTOS (cola en segundo plano)
# ============================================================
nexorix.import.workers=${NEXORIX_IMPORT_WORKERS:4}
nexorix.import.max-workers=${NEXORIX_IMPORT_MAX_WORKERS:8}
nexorix.import.queue-capacity=300
nexorix.import.max-files-per-upload=10
nexorix.import.max-active-per-user=20

# ============================================================
# INTELIGENCIA ARTIFICIAL (Gemini, de Google - tiene nivel gratuito)
# ============================================================
# Crea la clave gratis en https://aistudio.google.com/apikey
# Sin GEMINI_API_KEY, Nexorix funciona igual pero sin IA.
# Los nombres de modelo cambian con el tiempo: si Gemini responde que el modelo
# no existe, cambialos con NEXORIX_AI_MODEL / NEXORIX_AI_FAST_MODEL.
nexorix.ai.api-key=${GEMINI_API_KEY:}
nexorix.ai.model=${NEXORIX_AI_MODEL:gemini-3.5-flash}
nexorix.ai.fast-model=${NEXORIX_AI_FAST_MODEL:gemini-3.5-flash}
nexorix.ai.max-concurrent=${NEXORIX_AI_MAX_CONCURRENT:4}
nexorix.ai.timeout-seconds=90
nexorix.ai.agent-messages-per-hour=30

# ============================================================
# WHATSAPP (preguntar que se compro y recibir notas de voz)
# ============================================================
# Meta for Developers > tu app > WhatsApp > Configuracion de la API.
# Sin WHATSAPP_TOKEN y WHATSAPP_PHONE_NUMBER_ID, Nexorix funciona igual pero sin WhatsApp.
nexorix.whatsapp.token=${WHATSAPP_TOKEN:}
nexorix.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
# Numero del WhatsApp de Nexorix, solo para mostrarlo en la pagina (ej. 573001234567).
nexorix.whatsapp.business-phone=${WHATSAPP_BUSINESS_PHONE:}
# Secreto de la app (Configuracion > Basica): verifica la firma de los webhooks. Sin el, se rechazan todos.
nexorix.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
# Texto que inventas y escribes igual en Meta al configurar el webhook.
nexorix.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
# Plantilla aprobada en Meta para escribir primero. Cuerpo sugerido:
#   "Registraste un gasto de {{1}} ({{2}}). ¿Qué compraste? Respóndeme con una nota de voz."
# Sin plantilla se manda texto libre, que WhatsApp solo entrega si la persona escribio en las ultimas 24 horas.
nexorix.whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:}
nexorix.whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:es}
nexorix.whatsapp.api-version=${WHATSAPP_API_VERSION:v23.0}
nexorix.whatsapp.max-questions-per-day=20


# ============================================================
# BANCOS EN VIVO (webhooks de un agregador tipo Plaid / Prometeo - demo)
# ============================================================
# Secreto con el que el agregador firma el cuerpo (HMAC-SHA256). Sin el, se rechaza todo.
nexorix.bank.webhook-secret=${BANK_WEBHOOK_SECRET:}
# Simulador de movimientos (POST /api/bank/demo/...). En produccion: false.
nexorix.bank.demo-enabled=${NEXORIX_BANK_DEMO:true}

# ============================================================
# ANTIFRAUDE
# ============================================================
# Imposibilidad fisica: mas de X km/h entre dos operaciones separadas por al menos Y km.
nexorix.fraud.max-speed-kmh=${NEXORIX_FRAUD_MAX_SPEED_KMH:900}
nexorix.fraud.min-distance-km=${NEXORIX_FRAUD_MIN_DISTANCE_KM:150}
# Historial minimo (compras/transferencias) antes de marcar un comercio como "inusual".
nexorix.fraud.min-history=${NEXORIX_FRAUD_MIN_HISTORY:5}

# ============================================================
# SMS (Twilio) - alertas criticas. Sin claves, el SMS se muestra en el log ([DEMO SMS]).
# ============================================================
nexorix.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
nexorix.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
nexorix.sms.twilio.from=${TWILIO_FROM_NUMBER:}
